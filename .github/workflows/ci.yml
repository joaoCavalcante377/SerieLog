name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: serielog
          POSTGRES_PASSWORD: serielog
          POSTGRES_DB: serielog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serielog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://serielog:serielog@localhost:5432/serielog_test?schema=public
      TEST_DATABASE_URL: postgresql://serielog:serielog@localhost:5432/serielog_test?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_URL: http://localhost:3000
      TMDB_API_READ_TOKEN: ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
