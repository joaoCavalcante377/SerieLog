services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: serielog
      POSTGRES_PASSWORD: serielog
      POSTGRES_DB: serielog
    ports:
      - "5432:5432"
    volumes:
      - serielog-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serielog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  serielog-data:
